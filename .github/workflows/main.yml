name: CyberStream CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-process:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cyber-stream_db_cs_main
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Initialize Database Schema
        run: mysql -h 127.0.0.1 -u root -proot cyber-stream_db_cs_main < schema.sql

      - name: Run Jest Tests (Backend)
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: cyber-stream_db_cs_main
          NODE_ENV: test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Server and Run E2E Tests
        run: |
          npm start & 
          npx wait-on http://localhost:3000
          npm run test:e2e
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: cyber-stream_db_cs_main